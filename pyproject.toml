[project]
name = "doofenshmirtz-evil-incorporated-rag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5",
    "llama-index-core",
    "llama-index-readers-file",
    "docx2txt",
    "ollama>=0.6",
    "pydantic>=2",
    "snowballstemmer",
]

[project.optional-dependencies]
dev = [
    "build",
    "mypy",
    "pip-tools",
    "pytest",
    "pytest-cov",
    "ruff",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rag = ["prompts/lookup_*.md", "prompts/compare_*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "--cov=rag --cov=adapter --cov-report=term-missing -m 'not ollama'"
markers = ["ollama: needs a running local Ollama daemon"]

[tool.coverage.run]
source = ["rag", "adapter"]
omit = ["tests/*"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
