name: ci

on:
  push:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install ruff

      - name: Format check
        run: ruff format --check .

  build:
    runs-on: ubuntu-latest
    needs: format
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install build

      - name: Build
        run: python -m build

  test:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Check Cohere key
        env:
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
        run: |
          if [ -n "$COHERE_API_KEY" ]; then
            echo "COHERE_API_KEY is set"
          else
            echo "COHERE_API_KEY is empty"
            echo "Add repository secret COHERE_API_KEY on this same repo, then push to this branch."
            echo "Fork pull_request runs do not receive secrets; use a push on the repo that has the secret."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Unit and integration tests
        run: pytest

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:11434/api/tags && exit 0
            sleep 2
          done
          cat /tmp/ollama.log
          echo "ollama did not start" >&2
          exit 1

      - name: Pull models
        timeout-minutes: 60
        run: |
          ollama pull embeddinggemma:latest
          ollama pull gemma3:4b
        env:
          OLLAMA_HOST: http://127.0.0.1:11434

      - name: Ingest
        run: python -m rag.ingest docs chroma
        env:
          OLLAMA_HOST: http://127.0.0.1:11434

      - name: Evaluate
        timeout-minutes: 120
        run: pytest tests/test_eval.py::test_fixed_set_retrieval_and_answers -s -o addopts=
        env:
          OLLAMA_HOST: http://127.0.0.1:11434
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          GENERATE_MODEL: gemma3:4b
